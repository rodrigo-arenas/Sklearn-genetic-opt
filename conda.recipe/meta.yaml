{% set name = "sklearn-genetic-opt" %}
{% set version = load_file_regex(load_file="sklearn_genetic/_version.py", regex_search='__version__\s*=\s*["\']([^"\']+)["\']').group(1) %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/s/sklearn-genetic-opt/sklearn_genetic_opt-0.15.0.tar.gz
  sha256: d4295922fb7c12040a25c072414c85a02a7df085cad891274262acea822123d3

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.12
    - pip
    - setuptools >=77
    - wheel
  run:
    # Keep the general minimums in sync with pyproject.toml. As a noarch recipe,
    # this relies on conda's solver to select builds for the environment's Python
    # rather than mirroring pip's Python-specific wheel floors.
    # Optional plotting and MLflow extras MUST NOT be listed here. Pinning them as hard runtime
    # requirements is what made the previous conda-forge recipe unsolvable
    # (see issue #138). Users who need them can install the extras separately.
    - python >=3.12
    - scikit-learn >=1.5.0
    - numpy >=1.26.0
    - deap >=1.4.4
    - tqdm >=4.60.0
    - pandas >=1.3.0

test:
  imports:
    - sklearn_genetic
    - sklearn_genetic.callbacks
    - sklearn_genetic.schedules
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/rodrigo-arenas/Sklearn-genetic-opt
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Cross-validated hyperparameter search and feature selection for scikit-learn
  description: |
    Tune hyperparameters with GASearchCV or select feature subsets with
    GAFeatureSelectionCV. Both estimators include DEAP as the default optimizer
    and support alternative engines installed separately.
  doc_url: https://sklearngeneticopt.rodrigo-arenas.com/
  dev_url: https://github.com/rodrigo-arenas/Sklearn-genetic-opt

extra:
  recipe-maintainers:
    - rodrigo-arenas
