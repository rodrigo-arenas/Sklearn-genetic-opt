name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ["[0-9]*", "v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[lint]"
      - name: Check formatting
        run: black --check .

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    if: github.actor != 'github-actions[bot]'
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --upgrade-strategy eager -e ".[test,plot,mlflow]"
      - name: Run tests
        run: pytest sklearn_genetic/

  coverage:
    name: Coverage
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install coverage dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --upgrade-strategy eager -e ".[test,plot,mlflow]"
      - name: Run coverage
        run: |
          pytest sklearn_genetic/ --cov-fail-under=95 --cov=./ --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Upload coverage to Codecov
        # Dependabot PRs have no CODECOV_TOKEN, and Codecov rejects tokenless uploads from their protected branches.
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  docs:
    name: Docs
    # docs.yml handles the build and deploy on master/tag pushes; only run here on PRs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-vitepress/package.json
      - name: Install dependencies
        working-directory: docs-vitepress
        run: npm install
      - name: Build VitePress site
        working-directory: docs-vitepress
        run: npm run docs:build
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check internal documentation links
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest docs-vitepress/scripts/test_check_links.py docs-vitepress/scripts/test_site_contract.py -q
          python docs-vitepress/scripts/check_links.py

  package:
    name: Package
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]"
      - name: Build package
        run: python -m build
      - name: Check package metadata
        run: twine check dist/*

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, tests, coverage, package]
    runs-on: ubuntu-latest
    environment: pypi
    outputs:
      sdist_sha256: ${{ steps.sdist_digest.outputs.sha256 }}
    permissions:
      contents: read   # for checkout
      id-token: write  # for OIDC trusted publishing to PyPI
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build package
        run: python -m build
      - name: Record sdist checksum
        id: sdist_digest
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          sdists = list(Path("dist").glob("*.tar.gz"))
          if len(sdists) != 1:
              raise RuntimeError(f"Expected exactly one sdist, found {len(sdists)}")
          with sdists[0].open("rb") as source:
              digest = hashlib.file_digest(source, "sha256").hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"sha256={digest}\n")
          PY
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  sync-conda-recipe:
    name: Sync conda recipe
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.DOCS_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Read published sdist checksum
        env:
          TAG_NAME: ${{ github.ref_name }}
          SDIST_SHA256: ${{ needs.publish.outputs.sdist_sha256 }}
        run: |
          test -n "$SDIST_SHA256"
          echo "SHA256=$SDIST_SHA256" >> "$GITHUB_ENV"
          echo "VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"

      - name: Update conda recipe source
        run: |
          python conda.recipe/update_source.py "$VERSION" "$SHA256"

      - name: Commit and push updated recipe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin master
          git add conda.recipe/meta.yaml
          if git diff --staged --quiet; then
            echo "No changes to conda recipe."
          else
            git commit -m "ci: update conda recipe for ${{ github.ref_name }}"
            git push origin HEAD:master
          fi
